[package]
name = "connect-four"
version = "0.1.0"
authors = ["Nakayama Daiju <42.daiju@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2.130", features = ["serde-serialize"] }
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["console"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
rand = "0.10.3"
rand_pcg = "0.10.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
once_cell = "1.21.4"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
